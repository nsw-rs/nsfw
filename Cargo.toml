[package]
name = "nsfw-cli"
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
description = "Nintendo Switch NSP validation and Standard NSP conversion (Rust port of nsfw)"
license = "(MIT OR Apache-2.0) AND Apache-2.0"
authors = ["Timothy Redaelli <timothy.redaelli@gmail.com>"]
repository = "https://github.com/nsw-rs/nsfw"
readme = "README.md"
keywords = ["nintendo-switch", "nsp", "validation", "titledb"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/.gitignore", "/deny.toml"]

# Matches the asset names and layout made by .github/workflows/release.yml.
# pkg-fmt is left unset so binstall tries both the .tar.gz and .zip archives.
# Assets use the binary name "nsfw", not the package name.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/nsfw-v{ version }-{ target }{ archive-suffix }"
bin-dir = "nsfw-v{ version }-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "nsfw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
console = { version = "0.16.6", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18.6"
libhac = { version = "0.1.2", features = ["ncz"] }
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
